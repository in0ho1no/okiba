<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - Okiba</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="/">Okiba</a>
      <a href="/items/new" class="{{ 'active' if nav == 'register' }}">登録</a>
      <a href="/" class="{{ 'active' if nav == 'search' }}">検索・更新</a>
      <a href="/manage" class="{{ 'active' if nav == 'manage' }}">管理</a>
    </nav>
  </header>
  <main class="container">
    {% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
    {% if errors.get('item') %}<p class="error" role="alert">{{ errors['item'] }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
